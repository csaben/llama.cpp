[project]
name = "inkling-3090"
version = "0.1.0"
description = "Run Inkling 2 Mini at ~200 tok/s on one RTX 3090: downloads a prebuilt llama.cpp fork, the CUDA runtime and the model, then starts an OpenAI-compatible server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "huggingface_hub>=0.25",
    "nvidia-cuda-runtime-cu12==12.8.*",
    "nvidia-cublas-cu12==12.8.*",
]

[project.scripts]
inkling-3090 = "inkling3090:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inkling3090"]
